name: Professional Telegram Bot

on:
  workflow_dispatch:
    inputs:
      task:
        description: Select task
        required: true
        default: telegram_test
        type: choice
        options:
          - telegram_test
          - download_data
          - backtest
          - test_supabase
          - run_session

  schedule:
    - cron: "30 3 * * *"
    - cron: "30 6 * * *"
    - cron: "30 8 * * *"
    - cron: "30 12 * * *"
    - cron: "30 17 * * *"

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Telegram test
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'telegram_test'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          python -c "import os,requests; r=requests.post('https://api.telegram.org/bot'+os.environ['BOT_TOKEN']+'/sendMessage',json={'chat_id':os.environ['CHANNEL_ID'],'text':'PROFESSIONAL BOT CONNECTED'},timeout=20); r.raise_for_status(); print(r.json())"

      - name: Download candles
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'download_data'
        run: python download_data.py

      - name: Run backtest
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'backtest'
        run: python backtest.py

      - name: Test Supabase
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'test_supabase'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python test_supabase.py

      - name: Run session
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'run_session'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot.py

      - name: Run scheduled session
        if: github.event_name == 'schedule'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot.py

      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: backtest_trades.csv
          if-no-files-found: ignore

      - name: Upload candle data
        if: always() && github.event_name == 'workflow_dispatch' && inputs.task == 'download_data'
        uses: actions/upload-artifact@v4
        with:
          name: candle-data
          path: data/
          if-no-files-found: ignore
