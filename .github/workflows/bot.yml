
name: Professional Telegram Bot

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Choose task"
        required: true
        type: choice
        options:
          - backtest
          - telegram_test

permissions:
  contents: read

jobs:
  backtest:
    if: inputs.task == 'backtest'
    name: EURUSD Backtest
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backtest
        run: python backtest.py

      - name: Upload unseen reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-reports
          path: trades_*_unseen.csv
          if-no-files-found: warn
          retention-days: 7

  telegram_test:
    if: inputs.task == 'telegram_test'
    name: Telegram Connection Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install requests
        run: pip install "requests>=2.31,<3"

      - name: Test Telegram connection
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          python -c "import os,requests; u='https://api.telegram.org/bot'+os.environ['BOT_TOKEN']+'/sendMessage'; r=requests.post(u,json={'chat_id':os.environ['CHANNEL_ID'],'text':'PROFESSIONAL BOT — CONNECTION TEST SUCCESSFUL'},timeout=20); r.raise_for_status(); d=r.json(); assert d.get('ok'), d; print('Telegram connection successful')"
