name: Professional Telegram Bot

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Choose task"
        required: true
        default: "run_session"
        type: choice
        options:
          - run_session
          - backtest
          - telegram_test

  schedule:
    - cron: "30 3 * * *"   # 09:00 AM IST
    - cron: "30 6 * * *"   # 12:00 PM IST
    - cron: "30 8 * * *"   # 02:00 PM IST
    - cron: "30 12 * * *"  # 06:00 PM IST
    - cron: "30 17 * * *"  # 11:00 PM IST

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram test
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'telegram_test'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          python -c "import os,requests; u='https://api.telegram.org/bot'+os.environ['BOT_TOKEN']+'/sendMessage'; r=requests.post(u,json={'chat_id':os.environ['CHANNEL_ID'],'text':'🤖 PROFESSIONAL BOT CONNECTED!'},timeout=20); r.raise_for_status(); print(r.json())"

      - name: Run backtest
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'backtest'
        run: python backtest.py

      - name: Run scheduled session
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.task == 'run_session')
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot.py

      - name: Upload backtest report
        if: always() && github.event_name == 'workflow_dispatch' && inputs.task == 'backtest'
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: backtest_trades.csv
          if-no-files-found: ignore
