name: Professional Telegram Bot

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Choose task"
        required: true
        default: "run_session"
        type: choice
        options:
          - run_session
          - backtest
          - telegram_test

  schedule:
    - cron: "30 3 * * *"   # 09:00 AM IST
    - cron: "30 6 * * *"   # 12:00 PM IST
    - cron: "30 8 * * *"   # 02:00 PM IST
    - cron: "30 12 * * *"  # 06:00 PM IST
    - cron: "30 17 * * *"  # 11:00 PM IST

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram test
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'telegram_test'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHANNEL_ID }}
        run: |
          python -c "import os, requests; token = os.environ['TELEGRAM_BOT_TOKEN'].strip(); chat_id = os.environ['TELEGRAM_CHAT_ID'].strip(); url = f'https://api.telegram.org/bot{token}/sendMessage'; resp = requests.post(url, json={'chat_id': chat_id, 'text': '🤖 PROFESSIONAL BOT CONNECTED!'}, timeout=20); resp.raise_for_status(); print(resp.json())"

      - name: Run backtest
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'backtest'
        run: python backtest.py

      - name: Run manual session
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'run_session'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHANNEL_ID }}
          TASK: "run_session"
          FORCE_SESSION: "1"
        run: python bot.py

      - name: Run scheduled session
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHANNEL_ID }}
          TASK: "scheduled_session"
          FORCE_SESSION: "0"
        run: python bot.py

      - name: Upload backtest report
        if: always() && github.event_name == 'workflow_dispatch' && inputs.task == 'backtest'
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: backtest_trades.csv
          if-no-files-found: ignore
